name: Release APK

on:
  push:
    branches:
      - 'claude/galaxy-notification-history-app-abtsfl'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK and resolve release tag
        id: apk
        run: |
          mkdir -p dist
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v1.0.0"
          fi
          name="notificationlog-${tag}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${name}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*.apk

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: ${{ steps.apk.outputs.tag }}
          make_latest: true
          files: dist/*.apk
          body: |
            Galaxy 通知履歴アプリ（LINE等メッセージ通知をチャット表示）の Debug APK です。
            `notificationlog-*-debug.apk` をダウンロードして Galaxy にインストールしてください。

            - デバッグ鍵で署名済み（そのままインストール可能）
            - 初回起動後に「通知へのアクセス」を許可し、設定で対象アプリ（LINE等）を選んでください
